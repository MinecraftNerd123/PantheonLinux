app-id: io.github.MinecraftNerd123.PantheonLinux
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pantheon
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=xdg-run/hypr
  - --talk-name=org.freedesktop.Flatpak
  - --env=TESSDATA_PREFIX=/app/share/tessdata
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: grim
    buildsystem: meson
    config-opts:
      - -Djpeg=disabled
      - -Dman-pages=disabled
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/grim/-/archive/v1.5.0/grim-v1.5.0.tar.gz
        sha256: 9e72a98f7621b1f5741b405b8dbd447acf7d300ddb12667ec526db1ce6154eaa

  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DSW_BUILD=OFF
      - -DOPENMP_BUILD=OFF
      - -DENABLE_NATIVE=OFF
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.1.tar.gz
        sha256: a7a3f2a7420cb6a6a94d80c24163e183cf1d2f1bed2df3bbc397c81808a57237

  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  - name: pantheon
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ../..
        skip:
          - build-dir
          - repo
          - .flatpak-builder
          - dist
